<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Monitoring System</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">
    <!-- LOGIN VIEW -->
    <div id="view-login" class="login-page">
      <div class="login-card">
        <div class="login-logo">
          <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#0f2a4a"></circle>
            <path d="M18 42 L32 20 L46 42 M22 36 L22 50 L42 50 L42 36" fill="none" stroke="#7cc0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M24 42 L24 54 M40 42 L40 54" stroke="#7cc0ff" stroke-width="3" stroke-linecap="round"></path>
          </svg>
        </div>
        <h1 class="login-title">Attendance Monitoring System</h1>
        <p class="login-sub">Sign in to monitor student attendance</p>
        <div id="login-error" class="login-error hidden"></div>
        <form id="login-form">
          <div class="field">
            <label for="login-username">Username or Email</label>
            <input id="login-username" type="text" placeholder="e.g. admin" autocomplete="username" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" />
          </div>
          <div class="field">
            <label for="login-pin">Passcode (PIN)</label>
            <input id="login-pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter your 6-digit passcode" autocomplete="off" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign In</button>
        </form>
        <div class="login-demo">
          <p class="login-demo-title">Demo Accounts</p>
          <div class="login-demo-btns">
            <button class="btn btn-ghost btn-sm" id="demo-admin">Admin</button>
            <button class="btn btn-ghost btn-sm" id="demo-teacher">Teacher</button>
            <button class="btn btn-ghost btn-sm" id="demo-student">Student</button>
          </div>
        </div>
        <p class="login-register-link">No account? <a href="#/register">Register as Student</a></p>
        <div id="register-view" class="hidden">
          <h2>Student Registration</h2>
          <form id="register-form">
            <div class="field"><label for="reg-username">Username</label><input id="reg-username" type="text" /></div>
            <div class="field"><label for="reg-email">Email</label><input id="reg-email" type="email" /></div>
            <div class="field"><label for="reg-fullname">Full Name</label><input id="reg-fullname" type="text" /></div>
            <div class="field"><label for="reg-grade">Grade Level</label><input id="reg-grade" type="number" min="7" max="12" /></div>
            <div class="field"><label for="reg-section">Section</label><input id="reg-section" type="text" placeholder="e.g. A" /></div>
            <div class="field"><label for="reg-password">Password</label><input id="reg-password" type="password" /></div>
            <div class="field"><label for="reg-pin">Passcode (PIN)</label><input id="reg-pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" /></div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
          </form>
        </div>
      </div>
    </div>

    <!-- APP SHELL -->
    <div id="app-shell" class="hidden">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-logo">
            <svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
              <circle cx="32" cy="32" r="30" fill="#7cc0ff"></circle>
              <path d="M18 42 L32 20 L46 42 M22 36 L22 50 L42 50 L42 36" fill="none" stroke="#0f2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="M24 42 L24 54 M40 42 L40 54" stroke="#0f2a4a" stroke-width="3" stroke-linecap="round"></path>
            </svg>
          </div>
          <div class="sidebar-brand-name">Attendance Monitoring System</div>
        </div>
        <nav id="side-nav" class="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <div id="side-user" class="sidebar-user"></div>
          <button id="side-logout" class="btn btn-logout btn-block">Sign Out</button>
        </div>
      </aside>
      <div class="main">
        <header id="topbar" class="topbar">
          <div class="topbar-left">
            <button id="menu-toggle" class="icon-btn menu-toggle" title="Menu">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18 M3 12h18 M3 18h18"></path></svg>
            </button>
            <div class="topbar-title" id="topbar-title">Dashboard</div>
          </div>
          <div class="topbar-actions">
            <div class="bell-wrap">
              <button id="bell-btn" class="icon-btn" title="Notifications">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span id="bell-badge" class="bell-badge hidden">0</span>
              </button>
              <div id="bell-dropdown" class="bell-dropdown hidden">
                <div class="bell-dropdown-header">Notifications</div>
                <div id="bell-list"></div>
                <button id="bell-viewall" class="bell-viewall">View All</button>
              </div>
            </div>
            <div id="topbar-user" class="topbar-user"></div>
          </div>
        </header>
        <main id="content" class="content"></main>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/views-login.js"></script>
  <script src="/js/views-admin.js"></script>
  <script src="/js/views-teacher.js"></script>
  <script src="/js/views-student.js"></script>
  <script src="/js/views-shared.js"></script>
</body>
</html>
